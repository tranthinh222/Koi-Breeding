<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Transaction History</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="background">
      <div class="grass"></div>

      <div class="trees trees-left"></div>

      <div class="trees trees-right"></div>
    </div>
    <div class="background">
      <div class="grass"></div>
      <div class="trees trees-left"></div>
      <div class="trees trees-right"></div>
    </div>

    <header class="hud">
      <div class="player">
        <div class="avatar">🧑</div>

        <div>
          <h3>KoiMaster</h3>

          <p>Level: 18</p>
        </div>
      </div>

      <div class="wallet">
        <div class="gold">🪙 25,800</div>
      </div>
    </header>

    <div class="bottom-menu">
      <button>🏠 Home</button>

      <button>🎒 Inventory</button>

      <button>🛒 Shop</button>

      <button class="active">🏪 Marketplace</button>

      <button>⚙ Settings</button>
    </div>
    <section class="title-section">
      <div class="wood-sign">
        <h1>TRANSACTION HISTORY</h1>
      </div>
    </section>

    <section class="market-tabs">
      <button class="tab">🛒 Buy</button>

      <button class="tab">💰 Sell</button>

      <button class="tab">📋 My Listings</button>

      <button class="tab active">📜 History</button>
    </section>

    <section class="search-panel">
      <select>
        <option>All Transactions</option>

        <option>Bought</option>

        <option>Sold</option>
      </select>

      <select>
        <option>Newest</option>

        <option>Oldest</option>
      </select>
    </section>

    <section class="history-container">
      <article class="history-card">
        <div class="history-icon buy">🛒</div>

        <div class="history-info">
          <h3>Kohaku</h3>

          <p>Bought from DragonKoi</p>

          <p>31 Jul 2026</p>
        </div>

        <div class="history-price">-850 Gold</div>
      </article>

      <article class="history-card">
        <div class="history-icon sell">💰</div>

        <div class="history-info">
          <h3>Showa</h3>

          <p>Sold to AquaFish</p>

          <p>30 Jul 2026</p>
        </div>

        <div class="history-price income">+1200 Gold</div>
      </article>

      <article class="history-card">
        <div class="history-icon sell">💰</div>

        <div class="history-info">
          <h3>Sanke</h3>

          <p>Sold to Sakura</p>

          <p>28 Jul 2026</p>
        </div>

        <div class="history-price income">+760 Gold</div>
      </article>
    </section>
  </body>
</html>
