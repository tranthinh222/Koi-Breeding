<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Koi Shop</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <!-- ========================= -->
    <!-- Background -->
    <!-- ========================= -->

    <div class="background">
      <div class="grass"></div>

      <div class="trees trees-left"></div>

      <div class="trees trees-right"></div>
    </div>

    <!-- ========================= -->
    <!-- HUD -->
    <!-- ========================= -->

    <header class="hud">
      <div class="player">
        <div class="avatar">🧑</div>

        <div>
          <h3>KoiMaster</h3>

          <p>Level: 18</p>
        </div>
      </div>

      <div class="wallet">
        <div class="gold">🪙 25,800</div>

        <!-- <div class="diamond">💎 135</div> -->
      </div>
    </header>

    <nav class="navigation-menu">
      <button>🏠 Home</button>

      <button>🎒 Inventory</button>

      <button class="active">🛒 Shop</button>

      <button>🏪 Marketplace</button>

      <button>⚙︎ Settings</button>
    </nav>

    <!-- ========================= -->
    <!-- Wooden Sign -->
    <!-- ========================= -->

    <section class="title-section">
      <div class="wood-sign">
        <h1>KOI SHOP</h1>

        <p>Items Shop</p>
      </div>
    </section>

    <section class="market-tabs">
      <button class="tab">🥡 Food</button>
      <button class="tab">💊 Medicine</button>
      <button class="tab">🐟 Koi</button>
      <button class="tab active">🪙 Koins</button>
    </section>

    <!-- ========================= -->
    <!-- Fish Grid -->
    <!-- ========================= -->

    <main class="shop-main">
      <!-- Fish List -->
      <div class="fish-grid">
        <!-- CARD 1 -->
        <div class="fish-card">
          <div class="fish-image">
            <img src="assets/250_koins.svg" alt="250 Koins Icon" />
          </div>

          <h3>🪙 250 Koins</h3>

          <div class="price">💲0.99</div>

          <button>Buy</button>
        </div>

        <!-- CARD 2 -->
        <div class="fish-card">
          <div class="fish-image">
            <img src="assets/750_koins.svg" alt="750 Koins Icon" />
          </div>

          <h3>🪙 750 Koins</h3>

          <div class="price">💲2.99</div>

          <button>Buy</button>
        </div>

        <!-- CARD 3 -->
        <div class="fish-card">
          <div class="fish-image">
            <img src="assets/3000_koins.svg" alt="3000 Koins Icon" />
          </div>

          <h3>🪙 3000 Koins</h3>

          <div class="price">💲4.99</div>

          <button>Buy</button>
        </div>

        <!-- CARD 4 -->
        <div class="fish-card">
          <div class="fish-image">
            <img src="assets/9000_koins.svg" alt="9000 Koins Icon" />
          </div>

          <h3>🪙 9000 Koins</h3>

          <div class="price">💲9.99</div>

          <button>Buy</button>
        </div>

        <!-- CARD 5 -->
        <div class="fish-card">
          <div class="fish-image">
            <img src="assets/25000_koins.svg" alt="25000 Koins Icon" />
          </div>

          <h3>🪙 25000 Koins</h3>

          <div class="price">💲19.99</div>

          <button>Buy</button>
        </div>
      </div>

      <!-- Detail Panel -->
      <aside class="detail-panel">
        <div class="detail-header">Selected Item</div>

        <hr />

        <div class="detail-image">
          <img src="assets/250_koins.svg" alt="250 Koins Icon" />
        </div>

        <h2>🪙 250 Koins</h2>

        <div class="description">
          <p>
            250 Koins, a decent starting value for beginners if their wallet
            isn’t sufficient...
          </p>
        </div>

        <div class="detail-price">💲0.99</div>

        <button class="buy-btn">Buy Now</button>
      </aside>
    </main>
    <!-- ========================= -->
    <!-- Bottom Menu -->
    <!-- ========================= -->

    <!-- <footer class="bottom-menu">
			<button>🎒 Inventory</button>

			<button>📜 History</button>

			<button>🏪 My Listings</button>

			<button>⬅ Back</button>
		</footer> -->

    <script src="js/script.js"></script>
  </body>
</html>
